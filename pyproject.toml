[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-freebuff-workflow"
version = "0.1.0"
description = "Deterministic Discord -> Freebuff -> Cursor workflow bridge (no LLM in transport/control)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hermes-freebuff-cursor-workflow contributors" }]
keywords = ["hermes", "freebuff", "cursor", "workflow", "discord"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
workflow = "workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
